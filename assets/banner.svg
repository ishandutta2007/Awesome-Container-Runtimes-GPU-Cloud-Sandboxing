<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="45%" stop-color="#0e1426"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .glow-pulse-1 {
        animation: pulse1 6s ease-in-out infinite alternate;
      }
      .glow-pulse-2 {
        animation: pulse2 8s ease-in-out infinite alternate;
      }
      .glow-pulse-3 {
        animation: pulse3 7s ease-in-out infinite alternate;
      }
      .particle-float {
        animation: floatParticle 10s linear infinite;
      }
      .scanline-anim {
        animation: scanlineMove 8s linear infinite;
      }
      .pill-card {
        transition: transform 0.3s ease;
      }

      @keyframes pulse1 {
        0% { opacity: 0.3; transform: scale(1) translate(0, 0); }
        100% { opacity: 0.65; transform: scale(1.15) translate(30px, -20px); }
      }
      @keyframes pulse2 {
        0% { opacity: 0.25; transform: scale(1) translate(0, 0); }
        100% { opacity: 0.55; transform: scale(1.2) translate(-40px, 25px); }
      }
      @keyframes pulse3 {
        0% { opacity: 0.2; transform: scale(0.95); }
        100% { opacity: 0.45; transform: scale(1.1); }
      }
      @keyframes scanlineMove {
        0% { transform: translateY(-420px); }
        100% { transform: translateY(420px); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-80px) translateX(40px); opacity: 0.1; }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="420" fill="url(#cyberGrid)"/>

  <!-- Dynamic Glowing Ambient Orbs (strictly in background) -->
  <g>
    <circle cx="200" cy="120" r="140" fill="#38bdf8" filter="url(#neonGlow)" class="glow-pulse-1"/>
    <circle cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#neonGlow)" class="glow-pulse-2"/>
    <circle cx="600" cy="360" r="120" fill="#06b6d4" filter="url(#neonGlow)" class="glow-pulse-3"/>
    <circle cx="900" cy="100" r="90" fill="#ec4899" filter="url(#subtleGlow)" class="glow-pulse-1"/>
  </g>

  <!-- Animated Ambient Floating Nodes -->
  <g fill="#38bdf8" opacity="0.4">
    <circle cx="140" cy="280" r="3" class="particle-float"/>
    <circle cx="320" cy="80" r="2.5" class="particle-float" style="animation-delay: -3s;"/>
    <circle cx="850" cy="320" r="3" class="particle-float" style="animation-delay: -6s;"/>
    <circle cx="1080" cy="160" r="2" class="particle-float" style="animation-delay: -4s;"/>
    <circle cx="540" cy="60" r="2.5" class="particle-float" style="animation-delay: -2s;"/>
  </g>

  <!-- High-Tech Circuit/Border Accent Lines -->
  <path d="M 60 40 L 1140 40" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M 60 40 L 60 70" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 1140 40 L 1140 70" stroke="#c084fc" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 60 380 L 1140 380" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M 60 350 L 60 380" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 1140 350 L 1140 380" stroke="#c084fc" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Subtle Animated Scanner Sweep Bar (behind main text layer) -->
  <g class="scanline-anim" opacity="0.15">
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 85)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ⚡ AI INFRASTRUCTURE &amp; SECURE EXECUTION
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <g transform="translate(600, 155)">
    <!-- Shadow offset for maximum crisp contrast -->
    <text text-anchor="middle" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#000000" fill-opacity="0.8" letter-spacing="-0.5">
      Awesome Container Runtimes &amp; GPU Sandboxing
    </text>
    <text text-anchor="middle" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Container Runtimes &amp; GPU Sandboxing
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <g transform="translate(600, 202)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Ecosystem for Isolated AI Agents, MicroVMs, Serverless GPU Clouds &amp; OCI Runtimes
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Architecture Feature Pills (Y: 260) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: MicroVM Sandboxing -->
    <g transform="translate(-400, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="-62" cy="0" r="4" fill="#38bdf8"/>
      <text text-anchor="middle" x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
        🔒 MicroVMs &amp; gVisor
      </text>
    </g>

    <!-- Pill 2: AI Agent Isolation -->
    <g transform="translate(-195, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="-70" cy="0" r="4" fill="#818cf8"/>
      <text text-anchor="middle" x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
        🤖 AI Agent Sandboxes
      </text>
    </g>

    <!-- Pill 3: Serverless GPU Clouds -->
    <g transform="translate(15, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2"/>
      <circle cx="-70" cy="0" r="4" fill="#c084fc"/>
      <text text-anchor="middle" x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
        ⚡ GPU Neoclouds &amp; IaaS
      </text>
    </g>

    <!-- Pill 4: OCI & Low-Level Runtimes -->
    <g transform="translate(225, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="-70" cy="0" r="4" fill="#10b981"/>
      <text text-anchor="middle" x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
        📦 OCI &amp; CUDA Toolkits
      </text>
    </g>

    <!-- Pill 5: Distributed Ray & Schedulers -->
    <g transform="translate(420, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="-57" cy="0" r="4" fill="#f59e0b"/>
      <text text-anchor="middle" x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
        🌐 Cluster Brokers
      </text>
    </g>
  </g>

  <!-- Bottom Ecosystem Bar (Y: 335) -->
  <g transform="translate(600, 335)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1.5">
      FIRECRACKER • E2B • KATA • GVISOR • MODAL • COREWEAVE • RAY • VLLM • PODMAN • SKYPILOT
    </text>
  </g>
</svg>
